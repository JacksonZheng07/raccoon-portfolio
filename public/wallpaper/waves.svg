<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b24"/>
      <stop offset="0.55" stop-color="#14154a"/>
      <stop offset="1" stop-color="#2a0f45"/>
    </linearGradient>
    <linearGradient id="w1" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#1e3fae"/>
      <stop offset="0.5" stop-color="#3b5bff"/>
      <stop offset="1" stop-color="#7a4dff"/>
    </linearGradient>
    <linearGradient id="w2" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#5a2bd6"/>
      <stop offset="0.6" stop-color="#b14fe0"/>
      <stop offset="1" stop-color="#ff8a5c"/>
    </linearGradient>
    <linearGradient id="w3" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0" stop-color="#ff9d6c"/>
      <stop offset="0.5" stop-color="#ff5fa2"/>
      <stop offset="1" stop-color="#8d3cf0"/>
    </linearGradient>
    <linearGradient id="w4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b1a6b"/>
      <stop offset="1" stop-color="#2a50e8"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="0.25" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.62" cy="0.58" r="0.45">
      <stop offset="0" stop-color="#ffb38a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffb38a" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="haze" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <rect width="2560" height="1600" fill="url(#sky)"/>
  <rect width="2560" height="1600" fill="url(#glow)"/>

  <!-- Back band -->
  <path filter="url(#soft)" fill="url(#w1)" opacity="0.85"
    d="M-200 980 C 300 640, 820 600, 1260 760 S 2100 980, 2760 560 L 2760 1800 L -200 1800 Z"/>
  <path fill="url(#sheen)" opacity="0.5"
    d="M-200 980 C 300 640, 820 600, 1260 760 S 2100 980, 2760 560 L 2760 640 C 2100 1060, 1700 860, 1260 840 S 300 720, -200 1060 Z"/>

  <!-- Middle band -->
  <path filter="url(#soft)" fill="url(#w2)"
    d="M-200 1160 C 420 860, 980 900, 1420 1020 S 2240 1100, 2760 820 L 2760 1800 L -200 1800 Z"/>
  <path fill="url(#sheen)" opacity="0.6"
    d="M-200 1160 C 420 860, 980 900, 1420 1020 S 2240 1100, 2760 820 L 2760 900 C 2240 1180, 1800 1110, 1420 1100 S 420 940, -200 1240 Z"/>

  <!-- Bright front band -->
  <path filter="url(#soft)" fill="url(#w3)"
    d="M-200 1330 C 520 1100, 1100 1160, 1600 1240 S 2300 1260, 2760 1080 L 2760 1800 L -200 1800 Z"/>
  <path fill="url(#sheen)" opacity="0.7"
    d="M-200 1330 C 520 1100, 1100 1160, 1600 1240 S 2300 1260, 2760 1080 L 2760 1150 C 2300 1330, 2000 1310, 1600 1310 S 520 1170, -200 1400 Z"/>

  <!-- Deep foreground -->
  <path fill="url(#w4)"
    d="M-200 1500 C 600 1360, 1300 1420, 1900 1470 S 2500 1440, 2760 1380 L 2760 1800 L -200 1800 Z"/>

  <!-- Atmospheric haze where the bands meet -->
  <ellipse cx="1500" cy="1050" rx="700" ry="160" fill="#ff9fd0" opacity="0.18" filter="url(#haze)"/>
</svg>

name: software-update

# Pulls the Project Index from Notion and commit trends from GitHub and, when anything changed, opens a
# "Software Update" PR. Merging it is installing the update: Vercel deploys main.
on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sync:notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      # Commit trends for the My Projects widget; the built-in token reads public repos.
      - run: npm run sync:github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: software-update
          title: Software Update from Notion
          commit-message: Pull the latest Project Index from Notion
          body: Automated pull of the Notion Project Index. Merge to install.
          delete-branch: true
